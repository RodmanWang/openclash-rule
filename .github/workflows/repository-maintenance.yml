
name: 仓库自动清理维护

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      保留天数:
        description: "保留最近多少天的 Actions 运行记录和 Git 提交？"
        required: true
        default: 30
        type: number

      保留数量:
        description: "在保留天数范围内，最多保留多少条 Actions 运行记录，以及每个分支多少个 Git 提交？"
        required: true
        default: 100
        type: number

  # 每天北京时间 03:30
  schedule:
    - cron: '30 19 * * *'

concurrency:
  group: repository-maintenance-${{ github.repository }}
  cancel-in-progress: false

jobs:
  maintenance:
    name: 清理 Actions 和 Git 历史
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      GH_TOKEN: ${{ secrets.PERSON_TOKEN }}
      GH_REPO: ${{ github.repository }}

      # 定时任务和手动运行的默认值
      DEFAULT_RETENTION_DAYS: "30" # DEFAULT_RETENTION_DAYS_UPDATED
      DEFAULT_RETENTION_COUNT: "100" # DEFAULT_RETENTION_COUNT_UPDATED

      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      # 1. 检查 Token
      - name: 检查 PERSON_TOKEN
        shell: bash
        env:
          PERSON_TOKEN: ${{ secrets.PERSON_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$PERSON_TOKEN" ]; then
            echo "::error::未配置 PERSON_TOKEN。"
            exit 1
          fi

          echo "PERSON_TOKEN 检查通过。"

      # 2. Checkout
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.PERSON_TOKEN }}
          persist-credentials: true

      # 3. 配置 Git
      - name: 配置 Git
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 4. 读取并验证两个设置
      - name: 读取清理设置
        id: settings
        shell: bash
        env:
          INPUT_DAYS: ${{ inputs['保留天数'] }}
          INPUT_COUNT: ${{ inputs['保留数量'] }}
        run: |
          set -euo pipefail

          # 手动运行优先使用输入值，定时运行使用保存的默认值
          if [ -n "$INPUT_DAYS" ]; then
            RETENTION_DAYS="$INPUT_DAYS"
          else
            RETENTION_DAYS="$DEFAULT_RETENTION_DAYS"
          fi

          if [ -n "$INPUT_COUNT" ]; then
            RETENTION_COUNT="$INPUT_COUNT"
          else
            RETENTION_COUNT="$DEFAULT_RETENTION_COUNT"
          fi

          if ! [[ "$RETENTION_DAYS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::保留天数必须是大于 0 的整数。"
            exit 1
          fi

          if ! [[ "$RETENTION_COUNT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::保留数量必须是大于 0 的整数。"
            exit 1
          fi

          echo "days=$RETENTION_DAYS" >> "$GITHUB_OUTPUT"
          echo "count=$RETENTION_COUNT" >> "$GITHUB_OUTPUT"

          {
            echo "## 清理设置"
            echo ""
            echo "- 保留天数：$RETENTION_DAYS 天"
            echo "- 保留数量：$RETENTION_COUNT 条"
            echo ""
            echo "执行顺序：先按天数筛选，再按数量限制。"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "保留天数：$RETENTION_DAYS"
          echo "保留数量：$RETENTION_COUNT"

      
      # 5. 将手动设置保存为下次默认值
      - name: 保存手动设置
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          NEW_DAYS: ${{ steps.settings.outputs.days }}
          NEW_COUNT: ${{ steps.settings.outputs.count }}
        run: |
          set -euo pipefail

          WORKFLOW_FILE=".github/workflows/repository-maintenance.yml"

          if [ ! -f "$WORKFLOW_FILE" ]; then
            echo "::error::找不到工作流文件：$WORKFLOW_FILE"
            exit 1
          fi

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(".github/workflows/repository-maintenance.yml")
          lines = path.read_text().splitlines(keepends=True)

          days = os.environ["NEW_DAYS"]
          count = os.environ["NEW_COUNT"]

          if not days.isdigit() or int(days) <= 0:
              raise SystemExit("保留天数必须是正整数。")

          if not count.isdigit() or int(count) <= 0:
              raise SystemExit("保留数量必须是正整数。")

          def update_input_default(name, value):
              key = "      " + name + ":"
              matches = [
                  i for i, line in enumerate(lines)
                  if line.rstrip("\r\n") == key
              ]

              if len(matches) != 1:
                  raise SystemExit(
                      f"输入项 {name} 应出现一次，实际出现 {len(matches)} 次。"
                  )

              start = matches[0] + 1
              end = len(lines)

              for i in range(start, len(lines)):
                  line = lines[i]

                  if re.match(r"^      [^\s#]", line):
                      end = i
                      break

              defaults = [
                  i for i in range(start, end)
                  if re.match(r"^        default:\s*", lines[i])
              ]

              if len(defaults) != 1:
                  raise SystemExit(
                      f"输入项 {name} 的 default 应出现一次，"
                      f"实际出现 {len(defaults)} 次。"
                  )

              i = defaults[0]
              newline = "\n" if lines[i].endswith("\n") else ""
              lines[i] = f"        default: {value}{newline}"

          def update_env_default(name, value):
              prefix = "      " + name + ":"
              matches = [
                  i for i, line in enumerate(lines)
                  if line.startswith(prefix)
              ]

              if len(matches) != 1:
                  raise SystemExit(
                      f"环境变量 {name} 应出现一次，"
                      f"实际出现 {len(matches)} 次。"
                  )

              i = matches[0]
              newline = "\n" if lines[i].endswith("\n") else ""

              lines[i] = (
                  f'      {name}: "{value}"'
                  f" # {name}_UPDATED"
                  f"{newline}"
              )

          # 更新手动运行界面的默认值
          update_input_default("保留天数", days)
          update_input_default("保留数量", count)

          # 更新定时任务使用的默认值
          update_env_default("DEFAULT_RETENTION_DAYS", days)
          update_env_default("DEFAULT_RETENTION_COUNT", count)

          path.write_text("".join(lines))

          print("默认设置更新成功：")
          print(f"保留天数：{days}")
          print(f"保留数量：{count}")
          PY

          git add "$WORKFLOW_FILE"

          if ! git diff --cached --quiet; then
            git commit -m "chore: update maintenance retention settings"
            git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
            echo "已将新的清理设置保存到仓库。"
          else
            echo "清理设置没有变化，无需提交。"
          fi

      # 6. 清理 Actions
      - name: 清理 Actions 运行记录
        shell: bash
        env:
          KEEP_DAYS: ${{ steps.settings.outputs.days }}
          KEEP_COUNT: ${{ steps.settings.outputs.count }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          CUTOFF=$(date -u -d "$KEEP_DAYS days ago" +%s)

          echo "Actions 保留天数：$KEEP_DAYS"
          echo "Actions 保留数量：$KEEP_COUNT"

          # 获取所有已完成的运行记录，并按创建时间倒序排列
          gh api --paginate \
            "repos/$GH_REPO/actions/runs?per_page=100" \
            --jq '
              .workflow_runs[]
              | select(.status == "completed")
              | [.created_at, (.id | tostring)]
              | @tsv
            ' \
            | LC_ALL=C sort -r \
            > "$RUNNER_TEMP/actions-runs.tsv"

          DELETED=0
          ALREADY_ABSENT=0
          KEPT=0
          RECENT_INDEX=0

          while IFS=$'\t' read -r CREATED_AT RUN_ID; do
            [ -z "${RUN_ID:-}" ] && continue

            # 当前运行永远保留
            if [ "$RUN_ID" = "$CURRENT_RUN_ID" ]; then
              continue
            fi

            CREATED=$(date -u -d "$CREATED_AT" +%s)

            # 第一步：优先按天数判断
            if [ "$CREATED" -lt "$CUTOFF" ]; then
              SHOULD_DELETE=true
            else
              # 只有在天数范围内的记录才参与数量计算
              RECENT_INDEX=$((RECENT_INDEX + 1))

              # 数量包含当前正在运行的任务
              # 因此已完成记录最多保留 KEEP_COUNT - 1 条
              if [ "$RECENT_INDEX" -ge "$KEEP_COUNT" ]; then
                SHOULD_DELETE=true
              else
                SHOULD_DELETE=false
              fi
            fi

            if [ "$SHOULD_DELETE" = "true" ]; then
              echo "删除 Actions 运行记录：$RUN_ID ($CREATED_AT)"

              DELETE_ERROR_FILE="$RUNNER_TEMP/delete-run-error.txt"

              if gh api \
                --method DELETE \
                "repos/$GH_REPO/actions/runs/$RUN_ID" \
                > /dev/null 2> "$DELETE_ERROR_FILE"; then

                DELETED=$((DELETED + 1))

              else
                DELETE_ERROR=$(cat "$DELETE_ERROR_FILE")

                if [[ "$DELETE_ERROR" == *"404"* ]] ||
                   [[ "$DELETE_ERROR" == *"Not Found"* ]]; then

                  GET_ERROR_FILE="$RUNNER_TEMP/get-run-error.txt"

                  if gh api \
                    "repos/$GH_REPO/actions/runs/$RUN_ID" \
                    --silent \
                    > /dev/null 2> "$GET_ERROR_FILE"; then

                    echo "::error::删除返回 404，但记录仍然可以访问：$RUN_ID"
                    cat "$DELETE_ERROR_FILE"
                    exit 1

                  else
                    GET_ERROR=$(cat "$GET_ERROR_FILE")

                    if [[ "$GET_ERROR" == *"404"* ]] ||
                       [[ "$GET_ERROR" == *"Not Found"* ]]; then

                      echo "::warning::记录已不存在或当前不可访问：$RUN_ID"
                      ALREADY_ABSENT=$((ALREADY_ABSENT + 1))

                    else
                      echo "::error::无法确认记录状态：$RUN_ID"
                      cat "$DELETE_ERROR_FILE"
                      cat "$GET_ERROR_FILE"
                      exit 1
                    fi
                  fi

                else
                  echo "::error::删除 Actions 记录失败：$RUN_ID"
                  cat "$DELETE_ERROR_FILE"
                  exit 1
                fi
              fi
            else
              KEPT=$((KEPT + 1))
            fi

          done < "$RUNNER_TEMP/actions-runs.tsv"

          echo "已删除：$DELETED"
          echo "已不存在或无法访问：$ALREADY_ABSENT"
          echo "保留的已完成记录：$KEPT"

          {
            echo "## Actions 清理结果"
            echo ""
            echo "- 保留天数：$KEEP_DAYS"
            echo "- 保留数量：$KEEP_COUNT（包含当前运行）"
            echo "- 已删除：$DELETED"
            echo "- 已不存在或无法访问：$ALREADY_ABSENT"
            echo "- 保留的已完成记录：$KEPT"
          } >> "$GITHUB_STEP_SUMMARY"

      # 7. 安装 git-filter-repo
      - name: 安装 Git 历史清理工具
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv "$RUNNER_TEMP/filter-repo-venv"

          "$RUNNER_TEMP/filter-repo-venv/bin/pip" install \
            --disable-pip-version-check \
            git-filter-repo

          FILTER_REPO_BIN="$RUNNER_TEMP/filter-repo-venv/bin"

          echo "$FILTER_REPO_BIN" >> "$GITHUB_PATH"
          export PATH="$FILTER_REPO_BIN:$PATH"

          command -v git-filter-repo
          git-filter-repo --version

      # 8. 清理 Git 历史
      - name: 清理 Git Commits
        shell: bash
        env:
          KEEP_DAYS: ${{ steps.settings.outputs.days }}
          KEEP_COUNT: ${{ steps.settings.outputs.count }}
        run: |
          set -euo pipefail

          CUTOFF=$(date -u -d "$KEEP_DAYS days ago" +%s)

          echo "Git 提交保留天数：$KEEP_DAYS"
          echo "每个分支最多保留提交数：$KEEP_COUNT"

          # 获取所有远程分支
          git fetch origin --prune \
            '+refs/heads/*:refs/remotes/origin/*'

          git checkout --detach HEAD

          mapfile -t BRANCHES < <(
            git for-each-ref \
              --format='%(refname:strip=3)' \
              refs/remotes/origin \
            | grep -v '^HEAD$' \
            | sort -u
          )

          if [ "${#BRANCHES[@]}" -eq 0 ]; then
            echo "::error::没有找到远程分支。"
            exit 1
          fi

          echo "找到分支数量：${#BRANCHES[@]}"

          BRANCH_REFS=()

          for BRANCH in "${BRANCHES[@]}"; do
            git branch -f \
              "$BRANCH" \
              "refs/remotes/origin/$BRANCH"

            BRANCH_REFS+=("refs/heads/$BRANCH")
          done

          # 保存原始分支快照
          : > "$RUNNER_TEMP/branches-before.tsv"

          for BRANCH in "${BRANCHES[@]}"; do
            OLD_SHA=$(git rev-parse "refs/heads/$BRANCH")
            OLD_TREE=$(git rev-parse "refs/heads/$BRANCH^{tree}")

            printf '%s\t%s\t%s\n' \
              "$BRANCH" "$OLD_SHA" "$OLD_TREE" \
              >> "$RUNNER_TEMP/branches-before.tsv"

            # 临时保护原始提交对象
            git update-ref \
              "refs/maintenance-snapshots/$BRANCH" \
              "$OLD_SHA"
          done

          # 保护每个分支最新提交
          PROTECTED_TIPS=$(
            git for-each-ref \
              --format='%(objectname)' \
              refs/heads \
            | paste -sd, -
          )

          # 第一步：按天数筛选
          # 第二步：在天数范围内，按每个分支最近提交数量筛选
          : > "$RUNNER_TEMP/keep-commit-ids.txt"

          for BRANCH in "${BRANCHES[@]}"; do
            echo "筛选分支：$BRANCH"

            git rev-list --timestamp "refs/heads/$BRANCH" |
            while read -r COMMIT_TIME COMMIT_SHA; do
              [ -z "${COMMIT_SHA:-}" ] && continue

              # 超过天数范围的提交不参与数量保留
              if [ "$COMMIT_TIME" -lt "$CUTOFF" ]; then
                continue
              fi

              echo "$COMMIT_SHA"
            done |
            head -n "$KEEP_COUNT" \
              >> "$RUNNER_TEMP/keep-commit-ids.txt"
          done

          sort -u \
            "$RUNNER_TEMP/keep-commit-ids.txt" \
            -o "$RUNNER_TEMP/keep-commit-ids.txt"

          export CUTOFF_EPOCH="$CUTOFF"
          export PROTECTED_TIPS
          export KEEP_IDS_FILE="$RUNNER_TEMP/keep-commit-ids.txt"

          # 生成提交过滤回调
          cat > "$RUNNER_TEMP/commit-callback.py" <<'PY'
          import os

          cutoff = int(os.environ["CUTOFF_EPOCH"])

          protected_tips = set(
              filter(
                  None,
                  os.environ["PROTECTED_TIPS"].split(",")
              )
          )

          with open(os.environ["KEEP_IDS_FILE"]) as f:
              keep_ids = {
                  line.strip()
                  for line in f
                  if line.strip()
              }

          original_id = commit.original_id.decode("ascii")

          committer_timestamp = int(
              commit.committer_date.split()[0]
          )

          remove_by_age = committer_timestamp < cutoff
          remove_by_count = original_id not in keep_ids

          is_protected_tip = original_id in protected_tips

          if not is_protected_tip and (
              remove_by_age or remove_by_count
          ):
              commit.skip()
          PY

          echo "开始重写 Git 历史..."

          git-filter-repo \
            --force \
            --prune-empty never \
            --prune-degenerate never \
            --refs "${BRANCH_REFS[@]}" \
            --commit-callback "$RUNNER_TEMP/commit-callback.py"

          echo "Git 历史重写完成。"

          # 恢复 origin（如果工具移除了远程配置）
          if ! git remote get-url origin >/dev/null 2>&1; then
            git remote add origin \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          fi

          # 检查所有分支的文件快照
          CHANGED_BRANCHES=0

          while IFS=$'\t' read -r BRANCH OLD_SHA OLD_TREE; do
            [ -z "${BRANCH:-}" ] && continue

            if ! git show-ref \
              --verify \
              --quiet \
              "refs/heads/$BRANCH"; then

              echo "::error::重写后分支消失：$BRANCH"
              exit 1
            fi

            NEW_SHA=$(git rev-parse "refs/heads/$BRANCH")
            NEW_TREE=$(git rev-parse "refs/heads/$BRANCH^{tree}")

            if [ "$OLD_TREE" != "$NEW_TREE" ]; then
              echo "::error::分支文件快照发生变化：$BRANCH"

              echo "原始提交：$OLD_SHA"
              echo "新提交：$NEW_SHA"

              echo "原始 Tree：$OLD_TREE"
              echo "新 Tree：$NEW_TREE"

              git diff \
                --no-ext-diff \
                --name-status \
                "$OLD_TREE" \
                "$NEW_TREE" || true

              echo "::error::没有推送任何分支，Git 历史清理已中止。"
              exit 1
            fi

            if [ "$OLD_SHA" != "$NEW_SHA" ]; then
              CHANGED_BRANCHES=$((CHANGED_BRANCHES + 1))
            fi

            echo "快照检查通过：$BRANCH"

          done < "$RUNNER_TEMP/branches-before.tsv"

          echo "所有分支文件快照检查通过。"

          # 所有分支检查通过后，准备原子推送
          PUSH_LEASES=()
          PUSH_REFS=()

          while IFS=$'\t' read -r BRANCH OLD_SHA OLD_TREE; do
            [ -z "${BRANCH:-}" ] && continue

            NEW_SHA=$(git rev-parse "refs/heads/$BRANCH")

            if [ "$OLD_SHA" != "$NEW_SHA" ]; then
              PUSH_LEASES+=(
                "--force-with-lease=refs/heads/$BRANCH:$OLD_SHA"
              )

              PUSH_REFS+=(
                "refs/heads/$BRANCH:refs/heads/$BRANCH"
              )
            fi
          done < "$RUNNER_TEMP/branches-before.tsv"

          # 原子推送，避免部分分支更新成功
          if [ "${#PUSH_REFS[@]}" -gt 0 ]; then
            echo "正在原子推送 ${#PUSH_REFS[@]} 个分支..."

            git push \
              --atomic \
              "${PUSH_LEASES[@]}" \
              origin \
              "${PUSH_REFS[@]}"

            echo "所有分支推送成功。"
          else
            echo "无需修改 Git 历史。"
          fi

          # 推送成功后清理临时保护引用
          while IFS=$'\t' read -r BRANCH OLD_SHA OLD_TREE; do
            [ -z "${BRANCH:-}" ] && continue

            git update-ref \
              -d \
              "refs/maintenance-snapshots/$BRANCH"
          done < "$RUNNER_TEMP/branches-before.tsv"

          {
            echo "## Git 提交清理结果"
            echo ""
            echo "- 保留天数：$KEEP_DAYS"
            echo "- 每个分支保留数量：$KEEP_COUNT"
            echo "- 处理分支数：${#BRANCHES[@]}"
            echo "- 重写分支数：$CHANGED_BRANCHES"
            echo "- 文件快照：全部验证一致"
            echo "- 推送方式：原子推送"
          } >> "$GITHUB_STEP_SUMMARY"

      # 9. 最终报告
      - name: 清理结果
        if: always()
        shell: bash
        run: |
          {
            echo "## 仓库维护执行结果"
            echo ""
            echo "- 保留天数：${{ steps.settings.outputs.days }}"
            echo "- 保留数量：${{ steps.settings.outputs.count }}"
          } >> "$GITHUB_STEP_SUMMARY"
