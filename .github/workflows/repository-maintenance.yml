name: Repository Maintenance

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      workflow_runs_keep_days:
        description: "Workflow Runs retention (days)"
        required: false
        default: 7 # RETENTION_DEFAULT_RUNS
        type: number

      commits_keep_days:
        description: "Git Commits retention (days)"
        required: false
        default: 30 # RETENTION_DEFAULT_COMMITS
        type: number

      commits_keep_count:
        description: "Keep the most recent N Git commits per branch (0 = keep only the latest; empty = disabled)"
        required: false
        type: number

      actions_keep_count:
        description: "Keep the most recent N Actions workflow runs (0 = keep only the latest; empty = disabled)"
        required: false
        type: number

  schedule:
  - cron: '30 19 * * *' # Daily at 03:30 UTC+8

concurrency:
  group: openclash-rule-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    name: Clean Workflow Runs and Git History
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GH_TOKEN: ${{ secrets.PERSON_TOKEN }}
      GH_REPO: ${{ github.repository }}

      DEFAULT_RUNS_DAYS: "7" # RETENTION_DEFAULT_RUNS
      DEFAULT_COMMITS_DAYS: "30" # RETENTION_DEFAULT_COMMITS

      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      # 1. Check PERSON_TOKEN
      - name: Validate PERSON_TOKEN
        shell: bash
        env:
          PERSON_TOKEN: ${{ secrets.PERSON_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$PERSON_TOKEN" ]; then
            echo "::error::PERSON_TOKEN is missing."
            exit 1
          fi

          echo "PERSON_TOKEN is configured."

      # 2. Checkout default branch
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.PERSON_TOKEN }}
          persist-credentials: true

      # 3. Configure Git
      - name: Configure Git
        run: |
          set -euo pipefail

          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 4. Resolve manual settings
      - name: Set maintenance settings
        id: settings
        shell: bash
        env:
          INPUT_RUNS_DAYS: ${{ inputs.workflow_runs_keep_days }}
          INPUT_COMMITS_DAYS: ${{ inputs.commits_keep_days }}
          INPUT_COMMITS_COUNT: ${{ inputs.commits_keep_count }}
          INPUT_ACTIONS_COUNT: ${{ inputs.actions_keep_count }}
        run: |
          set -euo pipefail

          RUNS_DAYS="${INPUT_RUNS_DAYS:-$DEFAULT_RUNS_DAYS}"
          COMMITS_DAYS="${INPUT_COMMITS_DAYS:-$DEFAULT_COMMITS_DAYS}"
          COMMITS_COUNT="$INPUT_COMMITS_COUNT"
          ACTIONS_COUNT="$INPUT_ACTIONS_COUNT"

          for VALUE in "$RUNS_DAYS" "$COMMITS_DAYS"; do
            if ! [[ "$VALUE" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Retention days must be positive integers."
              exit 1
            fi
          done

          for VALUE in "$COMMITS_COUNT" "$ACTIONS_COUNT"; do
            if [ -n "$VALUE" ] && ! [[ "$VALUE" =~ ^[0-9]+$ ]]; then
              echo "::error::Optional count inputs must be non-negative integers."
              exit 1
            fi
          done

          echo "runs_days=$RUNS_DAYS" >> "$GITHUB_OUTPUT"
          echo "commits_days=$COMMITS_DAYS" >> "$GITHUB_OUTPUT"
          echo "commits_count=$COMMITS_COUNT" >> "$GITHUB_OUTPUT"
          echo "actions_count=$ACTIONS_COUNT" >> "$GITHUB_OUTPUT"

          {
            echo "## Maintenance Settings"
            echo ""
            echo "- Workflow Runs retention: $RUNS_DAYS days"
            echo "- Git Commits retention: $COMMITS_DAYS days"
            echo "- Keep latest commits per branch: ${COMMITS_COUNT:-not set}"
            echo "- Keep latest Actions runs: ${ACTIONS_COUNT:-not set}"
          } >> "$GITHUB_STEP_SUMMARY"

      # 5. Save manually selected retention-day defaults
      - name: Remember manual retention settings
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          NEW_RUNS_DAYS: ${{ steps.settings.outputs.runs_days }}
          NEW_COMMITS_DAYS: ${{ steps.settings.outputs.commits_days }}
        run: |
          set -euo pipefail

          WORKFLOW_FILE=".github/workflows/repository-maintenance.yml"

          if [ ! -f "$WORKFLOW_FILE" ]; then
            echo "::error::Workflow file not found: $WORKFLOW_FILE"
            exit 1
          fi

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(".github/workflows/repository-maintenance.yml")
          content = path.read_text()

          settings = [
              ("RETENTION_DEFAULT_RUNS", os.environ["NEW_RUNS_DAYS"], "DEFAULT_RUNS_DAYS"),
              ("RETENTION_DEFAULT_COMMITS", os.environ["NEW_COMMITS_DAYS"], "DEFAULT_COMMITS_DAYS"),
          ]

          for marker, value, env_name in settings:
              input_pattern = r'(?m)^(\s*default:\s*)\d+(\s+# ' + re.escape(marker) + r')$'
              content, count = re.subn(input_pattern, lambda m: m.group(1) + value + m.group(2), content)
              if count != 1:
                  raise SystemExit(f"Expected one input default for {marker}, found {count}")

              env_pattern = r'(?m)^(\s*' + re.escape(env_name) + r':\s*)"\d+"(\s+# ' + re.escape(marker) + r')$'
              content, count = re.subn(env_pattern, lambda m: m.group(1) + '"' + value + '"' + m.group(2), content)
              if count != 1:
                  raise SystemExit(f"Expected one env default for {marker}, found {count}")

          path.write_text(content)
          PY

          git add "$WORKFLOW_FILE"
          if ! git diff --cached --quiet; then
            git commit -m "chore: update maintenance retention defaults"
            git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          fi

      # 6. Run maintenance for both scheduled and manual triggers
      - name: Enable maintenance
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          echo "run_maintenance=true" >> "$GITHUB_OUTPUT"

      # 7. Delete old Workflow Runs and optionally enforce a count limit
      - name: Delete old Workflow Runs
        if: ${{ steps.gate.outputs.run_maintenance == 'true' }}
        shell: bash
        env:
          KEEP_DAYS: ${{ steps.settings.outputs.runs_days }}
          KEEP_COUNT: ${{ steps.settings.outputs.actions_count }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          CUTOFF=$(date -u -d "$KEEP_DAYS days ago" +%s)

          gh api --paginate \
            "repos/$GH_REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | [.id, .created_at] | @tsv' \
            > "$RUNNER_TEMP/actions-runs.tsv"

          DELETED=0
          KEPT=0
          INDEX=0

          while IFS=$'\t' read -r RUN_ID CREATED_AT; do
            [ -z "${RUN_ID:-}" ] && continue

            if [ "$RUN_ID" = "$CURRENT_RUN_ID" ]; then
              echo "Keeping current run: $RUN_ID"
              continue
            fi

            INDEX=$((INDEX + 1))
            CREATED=$(date -u -d "$CREATED_AT" +%s)

            EXCEEDS_COUNT=false
            if [ -n "$KEEP_COUNT" ] && [ "$INDEX" -ge "$KEEP_COUNT" ]; then
              # INDEX counts older completed runs; current run is retained separately.
              EXCEEDS_COUNT=true
            fi

            if [ "$CREATED" -lt "$CUTOFF" ] || [ "$EXCEEDS_COUNT" = "true" ]; then
              echo "Deleting run: $RUN_ID ($CREATED_AT)"
              gh api --method DELETE "repos/$GH_REPO/actions/runs/$RUN_ID"
              DELETED=$((DELETED + 1))
            else
              KEPT=$((KEPT + 1))
            fi
          done < "$RUNNER_TEMP/actions-runs.tsv"

          {
            echo "## Workflow Runs Cleanup"
            echo ""
            echo "- Age retention: $KEEP_DAYS days"
            echo "- Count limit: ${KEEP_COUNT:-not set}"
            echo "- Deleted: $DELETED"
            echo "- Kept: $KEPT"
          } >> "$GITHUB_STEP_SUMMARY"

      # 8. Install git-filter-repo
      - name: Install git-filter-repo
        if: ${{ steps.gate.outputs.run_maintenance == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv "$RUNNER_TEMP/filter-repo-venv"

          "$RUNNER_TEMP/filter-repo-venv/bin/pip" install \
            --disable-pip-version-check \
            git-filter-repo

          FILTER_REPO_BIN="$RUNNER_TEMP/filter-repo-venv/bin"

          echo "$FILTER_REPO_BIN" >> "$GITHUB_PATH"

          # 当前 Step 立即使用安装路径
          export PATH="$FILTER_REPO_BIN:$PATH"

          command -v git-filter-repo
          git-filter-repo --version

          echo "git-filter-repo installed successfully."

      # 9. Clean old history of every branch
      - name: Clean every branch by commit date and optional count
        if: ${{ steps.gate.outputs.run_maintenance == 'true' }}
        shell: bash
        env:
          KEEP_DAYS: ${{ steps.settings.outputs.commits_days }}
          KEEP_COUNT: ${{ steps.settings.outputs.commits_count }}
        run: |
          set -euo pipefail

          CUTOFF=$(date -u -d "$KEEP_DAYS days ago" +%s)
          echo "Git history age retention: $KEEP_DAYS days"
          echo "Optional per-branch commit count: ${KEEP_COUNT:-not set}"

          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
          git checkout --detach HEAD

          mapfile -t BRANCHES < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
            | grep -v '^HEAD$'
          )

          if [ "${#BRANCHES[@]}" -eq 0 ]; then
            echo "::error::No remote branches found."
            exit 1
          fi

          BRANCH_REFS=()
          for BRANCH in "${BRANCHES[@]}"; do
            git branch -f "$BRANCH" "refs/remotes/origin/$BRANCH"
            BRANCH_REFS+=("refs/heads/$BRANCH")
          done

          : > "$RUNNER_TEMP/branches-before.tsv"
          while IFS= read -r BRANCH; do
            [ -z "$BRANCH" ] && continue
            OLD_SHA=$(git rev-parse "refs/heads/$BRANCH")
            OLD_TREE=$(git rev-parse "refs/heads/$BRANCH^{tree}")
            printf '%s\t%s\t%s\n' "$BRANCH" "$OLD_SHA" "$OLD_TREE" \
              >> "$RUNNER_TEMP/branches-before.tsv"
          done < <(git for-each-ref --format='%(refname:strip=2)' refs/heads)

          PROTECTED_TIPS=$(
            git for-each-ref --format='%(objectname)' refs/heads | paste -sd, -
          )

          # When set, keep the newest N commits reachable from each branch.
          # N=0 intentionally yields an empty allow-list; branch tips are
          # separately protected, so only each branch tip survives count mode.
          if [ -n "$KEEP_COUNT" ]; then
            : > "$RUNNER_TEMP/keep-commit-ids.txt"
            for BRANCH in "${BRANCHES[@]}"; do
              git rev-list --max-count="$KEEP_COUNT" "refs/heads/$BRANCH" \
                >> "$RUNNER_TEMP/keep-commit-ids.txt"
            done
            sort -u "$RUNNER_TEMP/keep-commit-ids.txt" \
              -o "$RUNNER_TEMP/keep-commit-ids.txt"
          fi

          export CUTOFF_EPOCH="$CUTOFF"
          export PROTECTED_TIPS
          export KEEP_COUNT
          export KEEP_IDS_FILE="$RUNNER_TEMP/keep-commit-ids.txt"

          cat > "$RUNNER_TEMP/commit-callback.py" <<'PY'
          import os

          cutoff = int(os.environ["CUTOFF_EPOCH"])
          keep_count = os.environ.get("KEEP_COUNT", "")
          protected_tips = set(filter(None, os.environ["PROTECTED_TIPS"].split(",")))

          keep_ids = set()
          if keep_count != "":
              with open(os.environ["KEEP_IDS_FILE"]) as f:
                  keep_ids = {line.strip() for line in f if line.strip()}

          original_id = commit.original_id.decode("ascii")
          committer_timestamp = int(commit.committer_date.split()[0])

          # The age rule always applies. If count is supplied, commits outside
          # the newest-N allow-list are also removed. Branch tips are protected.
          remove_by_age = committer_timestamp < cutoff
          remove_by_count = keep_count != "" and original_id not in keep_ids

          if original_id not in protected_tips and (remove_by_age or remove_by_count):
              commit.skip()
          PY

          # Keep empty and degenerate commits during rewriting. Otherwise,
          # pruning can remove a branch-tip commit after its ancestors are
          # filtered, changing the branch's final file snapshot.
          git-filter-repo --force \
            --prune-empty never \
            --prune-degenerate never \
            --refs "${BRANCH_REFS[@]}" \
            --commit-callback "$RUNNER_TEMP/commit-callback.py"

          git remote remove origin 2>/dev/null || true
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          while IFS=$'\t' read -r BRANCH OLD_SHA OLD_TREE; do
            [ -z "${BRANCH:-}" ] && continue

            if ! git show-ref --verify --quiet "refs/heads/$BRANCH"; then
              echo "::error::Branch disappeared after filtering: $BRANCH"
              exit 1
            fi

            NEW_TREE=$(git rev-parse "refs/heads/$BRANCH^{tree}")
            if [ "$OLD_TREE" != "$NEW_TREE" ]; then
              echo "::error::File snapshot changed on branch: $BRANCH"
              exit 1
            fi
          done < "$RUNNER_TEMP/branches-before.tsv"

          while IFS=$'\t' read -r BRANCH OLD_SHA OLD_TREE; do
            [ -z "${BRANCH:-}" ] && continue
            NEW_SHA=$(git rev-parse "refs/heads/$BRANCH")
            if [ "$OLD_SHA" != "$NEW_SHA" ]; then
              git push --force-with-lease="refs/heads/$BRANCH:$OLD_SHA" origin \
                "refs/heads/$BRANCH:refs/heads/$BRANCH"
            fi
          done < "$RUNNER_TEMP/branches-before.tsv"

          {
            echo "## Git History Cleanup"
            echo ""
            echo "- Age retention: $KEEP_DAYS days"
            echo "- Per-branch count limit: ${KEEP_COUNT:-not set}"
            echo "- Branches processed: ${#BRANCHES[@]}"
            echo "- File snapshots: verified identical"
          } >> "$GITHUB_STEP_SUMMARY"

      # 10. Final summary
      - name: Maintenance summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Repository Maintenance Result"
            echo ""
            echo "- Workflow Runs retention: ${{ steps.settings.outputs.runs_days }} days"
            echo "- Git Commits retention: ${{ steps.settings.outputs.commits_days }} days"
            echo "- Keep latest commits per branch: ${{ steps.settings.outputs.commits_count }}"
            echo "- Keep latest Actions runs: ${{ steps.settings.outputs.actions_count }}"
            echo "- Maintenance executed: ${{ steps.gate.outputs.run_maintenance }}"
          } >> "$GITHUB_STEP_SUMMARY"
