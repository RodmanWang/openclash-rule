name: Repository Maintenance

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      workflow_runs_keep_days:
        description: "Workflow Runs retention (days)"
        required: false
        default: 7
        type: number

      commits_keep_days:
        description: "Git Commits retention (days)"
        required: false
        default: 30
        type: number

      commits_keep_count:
        description: "Keep the most recent N commits per branch (0 = keep only the latest; empty = disabled)"
        required: false
        type: number

      actions_keep_count:
        description: "Keep the most recent N workflow runs in total (0 = keep only the current run; empty = disabled)"
        required: false
        type: number

  # 每天北京时间 03:30
  schedule:
    - cron: '30 19 * * *'

concurrency:
  group: repository-maintenance-${{ github.repository }}
  cancel-in-progress: false

jobs:
  maintenance:
    name: Clean Workflow Runs and Git History
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      GH_TOKEN: ${{ secrets.PERSON_TOKEN }}
      GH_REPO: ${{ github.repository }}

      DEFAULT_RUNS_DAYS: "7" # RETENTION_DEFAULT_RUNS
      DEFAULT_COMMITS_DAYS: "30" # RETENTION_DEFAULT_COMMITS

      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:

      # 1. 检查 PERSON_TOKEN
      - name: Validate PERSON_TOKEN
        shell: bash
        env:
          PERSON_TOKEN: ${{ secrets.PERSON_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$PERSON_TOKEN" ]; then
            echo "::error::PERSON_TOKEN is missing."
            exit 1
          fi

          echo "PERSON_TOKEN is configured."

      # 2. Checkout 默认分支
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.PERSON_TOKEN }}
          persist-credentials: true

      # 3. 配置 Git
      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 4. 读取并验证设置
      - name: Set maintenance settings
        id: settings
        shell: bash
        env:
          INPUT_RUNS_DAYS: ${{ inputs.workflow_runs_keep_days }}
          INPUT_COMMITS_DAYS: ${{ inputs.commits_keep_days }}
          INPUT_COMMITS_COUNT: ${{ inputs.commits_keep_count }}
          INPUT_ACTIONS_COUNT: ${{ inputs.actions_keep_count }}
        run: |
          set -euo pipefail

          RUNS_DAYS="${INPUT_RUNS_DAYS:-$DEFAULT_RUNS_DAYS}"
          COMMITS_DAYS="${INPUT_COMMITS_DAYS:-$DEFAULT_COMMITS_DAYS}"

          COMMITS_COUNT="$INPUT_COMMITS_COUNT"
          ACTIONS_COUNT="$INPUT_ACTIONS_COUNT"

          if ! [[ "$RUNS_DAYS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Workflow Runs retention must be a positive integer."
            exit 1
          fi

          if ! [[ "$COMMITS_DAYS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Git Commits retention must be a positive integer."
            exit 1
          fi

          for VALUE in "$COMMITS_COUNT" "$ACTIONS_COUNT"; do
            if [ -n "$VALUE" ] && ! [[ "$VALUE" =~ ^[0-9]+$ ]]; then
              echo "::error::Optional count inputs must be non-negative integers."
              exit 1
            fi
          done

          echo "runs_days=$RUNS_DAYS" >> "$GITHUB_OUTPUT"
          echo "commits_days=$COMMITS_DAYS" >> "$GITHUB_OUTPUT"
          echo "commits_count=$COMMITS_COUNT" >> "$GITHUB_OUTPUT"
          echo "actions_count=$ACTIONS_COUNT" >> "$GITHUB_OUTPUT"

          {
            echo "## Maintenance Settings"
            echo ""
            echo "- Workflow Runs retention: $RUNS_DAYS days"
            echo "- Git Commits retention: $COMMITS_DAYS days"
            echo "- Commits count limit: ${COMMITS_COUNT:-not set}"
            echo "- Actions count limit: ${ACTIONS_COUNT:-not set}"
          } >> "$GITHUB_STEP_SUMMARY"

      # 5. 保存手动设置的天数默认值
      - name: Remember manual retention settings
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          NEW_RUNS_DAYS: ${{ steps.settings.outputs.runs_days }}
          NEW_COMMITS_DAYS: ${{ steps.settings.outputs.commits_days }}
        run: |
          set -euo pipefail

          WORKFLOW_FILE=".github/workflows/repository-maintenance.yml"

          if [ ! -f "$WORKFLOW_FILE" ]; then
            echo "::error::Workflow file not found: $WORKFLOW_FILE"
            exit 1
          fi

          import re
          from pathlib import Path

          path = Path(".github/workflows/repository-maintenance.yml")
          content = path.read_text()

          def update_input_default(content, input_name, value):
              pattern = (
                  r'(?ms)(^      ' + re.escape(input_name) + r':\n'
                  r'(?:(?!^      [A-Za-z0-9_-]+:).*\n)*?'
                  r'^        default:\s*)\d+'
              )
              updated, count = re.subn(
                  pattern,
                  lambda m: m.group(1) + value,
                  content,
              )
              if count != 1:
                  raise SystemExit(
                      f"Expected one default for input {input_name}, found {count}"
                  )
              return updated

          def update_env_default(content, env_name, value):
              pattern = (
                  r'(?m)(^      ' + re.escape(env_name) + r':\s*)"[^"]*"'
              )
              updated, count = re.subn(
                  pattern,
                  lambda m: m.group(1) + '"' + value + '"',
                  content,
              )
              if count != 1:
                  raise SystemExit(
                      f"Expected one environment default for {env_name}, found {count}"
                  )
              return updated

          content = update_input_default(
              content, "workflow_runs_keep_days",
              os.environ["NEW_RUNS_DAYS"]
          )
          content = update_input_default(
              content, "commits_keep_days",
              os.environ["NEW_COMMITS_DAYS"]
          )
          content = update_env_default(
              content, "DEFAULT_RUNS_DAYS",
              os.environ["NEW_RUNS_DAYS"]
          )
          content = update_env_default(
              content, "DEFAULT_COMMITS_DAYS",
              os.environ["NEW_COMMITS_DAYS"]
          )

          path.write_text(content)

          git add "$WORKFLOW_FILE"

          if ! git diff --cached --quiet; then
            git commit -m "chore: update maintenance retention defaults"

            git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          else
            echo "Retention defaults unchanged."
          fi

      # 6. 删除旧 Actions Runs
      - name: Delete old Workflow Runs
        shell: bash
        env:
          KEEP_DAYS: ${{ steps.settings.outputs.runs_days }}
          KEEP_COUNT: ${{ steps.settings.outputs.actions_count }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          CUTOFF=$(date -u -d "$KEEP_DAYS days ago" +%s)

          echo "Workflow Runs retention: $KEEP_DAYS days"
          echo "Workflow Runs count limit: ${KEEP_COUNT:-not set}"

          # 获取所有已完成的 Workflow Runs。
          # 先按创建时间倒序排列，再进行数量判断。
          gh api --paginate \
            "repos/$GH_REPO/actions/runs?per_page=100" \
            --jq '
              .workflow_runs[]
              | select(.status == "completed")
              | [.created_at, (.id | tostring)]
              | @tsv
            ' \
            | LC_ALL=C sort -r \
            > "$RUNNER_TEMP/actions-runs.tsv"

          DELETED=0
          ALREADY_ABSENT=0
          KEPT=0
          INDEX=0

          while IFS=$'\t' read -r CREATED_AT RUN_ID; do

            [ -z "${RUN_ID:-}" ] && continue

            # 当前运行永远保留。
            if [ "$RUN_ID" = "$CURRENT_RUN_ID" ]; then
              echo "Keeping current run: $RUN_ID"
              continue
            fi

            INDEX=$((INDEX + 1))

            CREATED=$(date -u -d "$CREATED_AT" +%s)

            EXCEEDS_COUNT=false

            # KEEP_COUNT 表示总保留数量，包含当前正在运行的任务。
            #
            # 0：只保留当前运行。
            # 1：只保留当前运行。
            # 2：当前运行 + 最近一条已完成运行。
            # 3：当前运行 + 最近两条已完成运行。
            #
            # INDEX 从 1 开始，因此 INDEX >= KEEP_COUNT 时删除。
            if [ -n "$KEEP_COUNT" ] &&
               [ "$INDEX" -ge "$KEEP_COUNT" ]; then
              EXCEEDS_COUNT=true
            fi

            # 年限和数量是同时生效的限制。
            # 任意一项不满足，就删除该运行记录。
            if [ "$CREATED" -lt "$CUTOFF" ] ||
               [ "$EXCEEDS_COUNT" = "true" ]; then

              echo "Deleting run: $RUN_ID ($CREATED_AT)"

              DELETE_ERROR_FILE="$RUNNER_TEMP/delete-run-error.txt"

              if gh api \
                --method DELETE \
                "repos/$GH_REPO/actions/runs/$RUN_ID" \
                > /dev/null 2> "$DELETE_ERROR_FILE"; then

                DELETED=$((DELETED + 1))

              else

                DELETE_ERROR=$(cat "$DELETE_ERROR_FILE")

                if [[ "$DELETE_ERROR" == *"404"* ]] ||
                   [[ "$DELETE_ERROR" == *"Not Found"* ]]; then

                  # 404 可能是其他操作已经删除了这条记录。
                  # 再查询一次，确认它是否仍然存在。
                  GET_ERROR_FILE="$RUNNER_TEMP/get-run-error.txt"

                  if gh api \
                    "repos/$GH_REPO/actions/runs/$RUN_ID" \
                    --silent \
                    > /dev/null 2> "$GET_ERROR_FILE"; then

                    echo "::error::DELETE returned 404, but run $RUN_ID is still accessible."
                    echo "::error::Check PERSON_TOKEN Actions write permission."
                    cat "$DELETE_ERROR_FILE"
                    exit 1

                  else

                    GET_ERROR=$(cat "$GET_ERROR_FILE")

                    if [[ "$GET_ERROR" == *"404"* ]] ||
                       [[ "$GET_ERROR" == *"Not Found"* ]]; then

                      echo "::warning::Run $RUN_ID is already absent or inaccessible. Skipping."
                      ALREADY_ABSENT=$((ALREADY_ABSENT + 1))

                    else

                      echo "::error::Failed to verify run $RUN_ID after DELETE returned 404."
                      cat "$DELETE_ERROR_FILE"
                      cat "$GET_ERROR_FILE"
                      exit 1

                    fi
                  fi

                else

                  echo "::error::Failed to delete workflow run $RUN_ID."
                  cat "$DELETE_ERROR_FILE"
                  exit 1

                fi
              fi

            else

              KEPT=$((KEPT + 1))

            fi

          done < "$RUNNER_TEMP/actions-runs.tsv"

          echo "Deleted: $DELETED"
          echo "Already absent or inaccessible: $ALREADY_ABSENT"
          echo "Kept: $KEPT"

          {
            echo "## Workflow Runs Cleanup"
            echo ""
            echo "- Age retention: $KEEP_DAYS days"
            echo "- Count limit: ${KEEP_COUNT:-not set}"
            echo "- Deleted: $DELETED"
            echo "- Already absent or inaccessible: $ALREADY_ABSENT"
            echo "- Kept: $KEPT"
          } >> "$GITHUB_STEP_SUMMARY"

      # 7. 安装 git-filter-repo
      - name: Install git-filter-repo
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv "$RUNNER_TEMP/filter-repo-venv"

          "$RUNNER_TEMP/filter-repo-venv/bin/pip" install \
            --disable-pip-version-check \
            git-filter-repo

          FILTER_REPO_BIN="$RUNNER_TEMP/filter-repo-venv/bin"

          echo "$FILTER_REPO_BIN" >> "$GITHUB_PATH"

          export PATH="$FILTER_REPO_BIN:$PATH"

          command -v git-filter-repo
          git-filter-repo --version

      # 8. 清理所有分支的 Git 历史
      - name: Clean Git history
        shell: bash
        env:
          KEEP_DAYS: ${{ steps.settings.outputs.commits_days }}
          KEEP_COUNT: ${{ steps.settings.outputs.commits_count }}
        run: |
          set -euo pipefail

          CUTOFF=$(date -u -d "$KEEP_DAYS days ago" +%s)

          echo "Git history age retention: $KEEP_DAYS days"
          echo "Git commit count limit: ${KEEP_COUNT:-not set}"

          # 获取远程所有分支。
          git fetch origin --prune \
            '+refs/heads/*:refs/remotes/origin/*'

          # 进入 detached HEAD，避免当前分支被重写时发生冲突。
          git checkout --detach HEAD

          mapfile -t BRANCHES < <(
            git for-each-ref \
              --format='%(refname:strip=3)' \
              refs/remotes/origin \
            | grep -v '^HEAD$' \
            | sort -u
          )

          if [ "${#BRANCHES[@]}" -eq 0 ]; then
            echo "::error::No remote branches found."
            exit 1
          fi

          echo "Branches found: ${#BRANCHES[@]}"

          # 建立所有远程分支对应的本地分支。
          BRANCH_REFS=()

          for BRANCH in "${BRANCHES[@]}"; do

            git branch -f \
              "$BRANCH" \
              "refs/remotes/origin/$BRANCH"

            BRANCH_REFS+=("refs/heads/$BRANCH")

          done

          # 保存每个分支原始 SHA 和 tree。
          # 同时建立临时保护引用，避免原始对象在重写期间被回收。
          : > "$RUNNER_TEMP/branches-before.tsv"

          for BRANCH in "${BRANCHES[@]}"; do

            OLD_SHA=$(git rev-parse "refs/heads/$BRANCH")

            OLD_TREE=$(git rev-parse "refs/heads/$BRANCH^{tree}")

            printf '%s\t%s\t%s\n' \
              "$BRANCH" \
              "$OLD_SHA" \
              "$OLD_TREE" \
              >> "$RUNNER_TEMP/branches-before.tsv"

            git update-ref \
              "refs/maintenance-snapshots/$BRANCH" \
              "$OLD_SHA"

            echo "Protected snapshot: $BRANCH"
          done

          # 所有分支 tip 都必须保留。
          PROTECTED_TIPS=$(
            git for-each-ref \
              --format='%(objectname)' \
              refs/heads \
            | paste -sd, -
          )

          # 构建每个分支最近 N 个提交的并集。
          if [ -n "$KEEP_COUNT" ]; then

            : > "$RUNNER_TEMP/keep-commit-ids.txt"

            if [ "$KEEP_COUNT" != "0" ]; then

              for BRANCH in "${BRANCHES[@]}"; do

                git rev-list \
                  --max-count="$KEEP_COUNT" \
                  "refs/heads/$BRANCH" \
                  >> "$RUNNER_TEMP/keep-commit-ids.txt"

              done

            fi

            sort -u \
              "$RUNNER_TEMP/keep-commit-ids.txt" \
              -o "$RUNNER_TEMP/keep-commit-ids.txt"

          fi

          export CUTOFF_EPOCH="$CUTOFF"
          export PROTECTED_TIPS
          export KEEP_COUNT
          export KEEP_IDS_FILE="$RUNNER_TEMP/keep-commit-ids.txt"

          # 生成提交过滤回调。
          cat > "$RUNNER_TEMP/commit-callback.py" <<'PY'
          import os

          cutoff = int(os.environ["CUTOFF_EPOCH"])

          keep_count = os.environ.get("KEEP_COUNT", "")

          protected_tips = set(
              filter(
                  None,
                  os.environ["PROTECTED_TIPS"].split(",")
              )
          )

          keep_ids = set()

          if keep_count != "":
              with open(os.environ["KEEP_IDS_FILE"]) as f:
                  keep_ids = {
                      line.strip()
                      for line in f
                      if line.strip()
                  }

          original_id = commit.original_id.decode("ascii")

          committer_timestamp = int(
              commit.committer_date.split()[0]
          )

          # 规则一：超过保留天数的提交需要删除。
          remove_by_age = committer_timestamp < cutoff

          # 规则二：不在最近 N 个提交列表中的提交需要删除。
          remove_by_count = (
              keep_count != ""
              and original_id not in keep_ids
          )

          # 分支最新 tip 无论如何都不能删除。
          is_protected_tip = original_id in protected_tips

          if not is_protected_tip and (
              remove_by_age or remove_by_count
          ):
              commit.skip()
          PY

          echo "Starting Git history rewrite..."

          # 显式禁止自动修剪空提交和退化合并提交。
          # 避免过滤后意外改变分支 tip 的文件快照。
          git-filter-repo \
            --force \
            --prune-empty never \
            --prune-degenerate never \
            --refs "${BRANCH_REFS[@]}" \
            --commit-callback "$RUNNER_TEMP/commit-callback.py"

          echo "Git history rewrite completed."

          # git-filter-repo 可能移除 origin。
          # 如果 origin 仍存在，保留原有配置和凭据。
          if ! git remote get-url origin >/dev/null 2>&1; then
            git remote add origin \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          fi

          # 第一阶段：检查所有分支。
          # 任何一个分支文件快照不一致，都立即中止。
          # 在全部检查完成前，不允许推送任何分支。
          CHANGED_BRANCHES=0

          while IFS=$'\t' read -r BRANCH OLD_SHA OLD_TREE; do

            [ -z "${BRANCH:-}" ] && continue

            if ! git show-ref \
              --verify \
              --quiet \
              "refs/heads/$BRANCH"; then

              echo "::error::Branch disappeared after filtering: $BRANCH"
              exit 1
            fi

            NEW_SHA=$(git rev-parse "refs/heads/$BRANCH")

            NEW_TREE=$(git rev-parse "refs/heads/$BRANCH^{tree}")

            if [ "$OLD_TREE" != "$NEW_TREE" ]; then

              echo "::error::File snapshot changed on branch: $BRANCH"

              echo "Original commit: $OLD_SHA"
              echo "New commit:      $NEW_SHA"

              echo "Original tree: $OLD_TREE"
              echo "New tree:      $NEW_TREE"

              echo "Changed files:"

              git diff \
                --no-ext-diff \
                --name-status \
                "$OLD_TREE" \
                "$NEW_TREE" || true

              echo "::error::No branches have been pushed. Git history cleanup aborted."

              exit 1
            fi

            if [ "$OLD_SHA" != "$NEW_SHA" ]; then
              CHANGED_BRANCHES=$((CHANGED_BRANCHES + 1))
            fi

            echo "Verified snapshot: $BRANCH"

          done < "$RUNNER_TEMP/branches-before.tsv"

          echo "All branch snapshots verified."

          # 第二阶段：准备所有分支的推送参数。
          PUSH_LEASES=()
          PUSH_REFS=()

          while IFS=$'\t' read -r BRANCH OLD_SHA OLD_TREE; do

            [ -z "${BRANCH:-}" ] && continue

            NEW_SHA=$(git rev-parse "refs/heads/$BRANCH")

            if [ "$OLD_SHA" != "$NEW_SHA" ]; then

              PUSH_LEASES+=(
                "--force-with-lease=refs/heads/$BRANCH:$OLD_SHA"
              )

              PUSH_REFS+=(
                "refs/heads/$BRANCH:refs/heads/$BRANCH"
              )

            fi

          done < "$RUNNER_TEMP/branches-before.tsv"

          # 第三阶段：原子推送。
          # 任意一个分支推送失败，服务器不会只更新其中一部分。
          if [ "${#PUSH_REFS[@]}" -gt 0 ]; then

            echo "Pushing ${#PUSH_REFS[@]} rewritten branches atomically..."

            git push \
              --atomic \
              "${PUSH_LEASES[@]}" \
              origin \
              "${PUSH_REFS[@]}"

            echo "All branches pushed successfully."

          else

            echo "No Git history changes required."

          fi

          # 推送成功后清理临时保护引用。
          while IFS=$'\t' read -r BRANCH OLD_SHA OLD_TREE; do

            [ -z "${BRANCH:-}" ] && continue

            git update-ref \
              -d \
              "refs/maintenance-snapshots/$BRANCH"

          done < "$RUNNER_TEMP/branches-before.tsv"

          {
            echo "## Git History Cleanup"
            echo ""
            echo "- Age retention: $KEEP_DAYS days"
            echo "- Per-branch count limit: ${KEEP_COUNT:-not set}"
            echo "- Branches processed: ${#BRANCHES[@]}"
            echo "- Branches rewritten: $CHANGED_BRANCHES"
            echo "- File snapshots: all verified identical"
            echo "- Push method: atomic"
          } >> "$GITHUB_STEP_SUMMARY"

      # 9. 最终执行结果
      - name: Maintenance summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Repository Maintenance Result"
            echo ""
            echo "- Workflow Runs retention: ${{ steps.settings.outputs.runs_days }} days"
            echo "- Git Commits retention: ${{ steps.settings.outputs.commits_days }} days"
            echo "- Keep latest commits per branch: ${{ steps.settings.outputs.commits_count }}"
            echo "- Keep latest Actions runs: ${{ steps.settings.outputs.actions_count }}"
          } >> "$GITHUB_STEP_SUMMARY"
